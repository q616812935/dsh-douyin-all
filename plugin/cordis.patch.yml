# ============================================================================
# dsh-douyin-all —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# ⚠️ 这里只放「身份类」配置（改了就换目标的那种）：端口、可执行文件、状态目录。
#    可开关的键（enabled / peer / 私信 / 评论 / 刷流 / 日报）一律由设置页写
#    $HOME/config.json —— 放进 cordis 的话设置页就永远改不动（cordis 层优先级最高）。
#
# 单实例：同一个 DSH 可能同时加载 web / desktop 两个 profile 的同一份插件，
# 所以状态目录必须写死，否则两边各用一份 config.json 与浏览器 profile。
# ============================================================================

- insert:
    - id: douyin-all
      name: 'dsh-douyin-all'
      config:
        port: 9334
        home: 'C:/dsh/douyin-all'
