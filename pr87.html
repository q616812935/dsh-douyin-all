const F = {"README.txt":"Thanks for the review — every blocking item is addressed, and here is what we measured while verifying the panel claim.\n\n## Fixes shipped (npm `dsh-douyin-all@0.4.9`, `latest`)\n\n| review item | fix |\n| --- | --- |\n| `exports` missing `./client` | `exports` now `{\".\":\"./index.js\",\"./client\":\"./client.js\",\"./package.json\":\"./package.json\"}` |\n| `dsh.client.inject: [\"slots\"]` | removed; `dsh.client` is now `{ \"platform\": \"web\", \"external\": [\"react\"] }` |\n| `test` script not runnable | `\"test\": \"node --test \\\"tests/**/*.test.mjs\\\"\"` (89 tests, all green) |\n| no edge cleanup on dispose | `stopEdge(port)` is called from the disposer |\n| top-level `enabled` on by default | defaults to `false`, must be switched on explicitly |\n| LICENSE mixes upstream MIT and new code | §4 rewritten: upstream MIT rights are not revoked; new work is proprietary |\n\nTwo more defects found while testing and fixed in the same line of releases:\n\n- `client.js` hard-coded one specific persona name; it is now a generic card with the placeholder “leave empty to use the built-in persona card” (your earlier note about the plugin being published for everyone, not for one person).\n- A manual pause switch: dropping a `PAUSE` file into the state dir (ISO time or epoch ms) stops all proactive outbound traffic until that time, and the status endpoint reports `auto.pausedUntil`.\n\n## About “add `./client` and the panel appears”\n\nThat is necessary but not sufficient. The client half of a plugin is assembled only from rows that exist in the cordis loader tree: the host iterates `ctx.loader.entries()` and calls `resolveSource(entry)` for each enabled row; `profile.bundles` in `package.json` is never consulted there. A profile's `cordis.yml` is rewritten to the empty root at every boot, so the composition lives in the patch layers: **each bundle's own `dsh.bundle.patch` → the profile's `cordis.patch.yml` → `--patch` overlays**.\n\nSo after a plain `dsh plugin add` (which only writes `dsh.profile.bundles`) there is no loader row, and `GET /` returns a boot payload without the entry:\n\n```\n__DSH_BOOT__.entries: 70, dsh-douyin-all: undefined\napplication batch len=9111089  has-all=false  has-label=false\n```\n\nWith the loader row present (`- insert: [ { id: douyin-all, name: dsh-douyin-all } ]` as the profile's single top-level array), the same build serves:\n\n```\n__DSH_BOOT__.entries: {\"id\":\"dsh-douyin-all\",\"url\":\"plugins/??dsh-douyin-all/client.js&rev=55a305a988d1\",\"external\":[\"react\"]}\napplication batch len=2083181  has-all=true  has-label=true      # “刷抖音” settings section\n```\n\nTwo things worth putting in the docs, because both cost us an evening:\n\n1. `cordis.patch.yml` must be **one top-level YAML array**. Appending `- insert:` after an existing `[]` fails the boot with `failed to parse overlay … YAMLException: end of the stream or a document separator is expected`.\n2. The npm package cannot install that row by itself; a bundle's `dsh.bundle.patch` only contributes rows when the bundle name is already in `dsh.profile.bundles`. `dsh plugin add` and `npm install` both leave the profile's `cordis.patch.yml` untouched, so the README now states the manual step (and the symptom “tools work, the settings panel is empty” when it is missed).\n\n## Index entry\n\n`community.json` at `main` currently has 104 entries (last one `dsh-power-menu-mac`). My token has only read access to this repository, and both `POST /repos/zhu1090093659/dsh-community-plugins/forks` and a user-repository fork return `403 Resource not accessible by personal access token`, so I could not open the branch for the entry. The entry itself is ready and validated against the `community-index` contract:\n\n```json\n{\n  \"id\": \"dsh-douyin-all\",\n  \"name\": \"抖音自动陪伴\",\n  \"nameEn\": \"Douyin Auto Companion\",\n  \"author\": \"q616812935\",\n  \"description\": \"把抖音私信自动回复、作品评论自动回复、刷推荐流挑视频转发、人格与长期记忆、语音回复、观看日报合并成一个 DSH 插件，全部走同一个 Edge 浏览器会话。内置免打扰时段与发送频率限制，会真的“看”短视频并按自己的口味打分积累兴趣取向，也能在自己喜欢的别人作品下 @ 主人。含去重闸、禁词闸与站外引导拦截。\",\n  \"descriptionEn\": \"One DSH plugin that merges Douyin DM auto-reply, comment auto-reply on your own and others' works, recommendation-feed browsing with video sharing, persona plus long-term memory, voice replies and viewing reports, all driven through a single Edge browser session. Ships quiet hours and send-rate limits, actually \\\"watches\\\" each short video and accumulates its own taste profile, and can @-mention you under works it likes. Outbound guard covers duplicate, banned-word and off-site-link checks.\",\n  \"repo\": \"https://github.com/q616812935/dsh-douyin-all\",\n  \"npm\": \"dsh-douyin-all\",\n  \"category\": \"integration\",\n  \"subcategory\": \"bridge\"\n}\n```\n\nThe market index served from this plugin's repository (`index.json`, format 1, validated by `parseMarketIndex`) points at `{\"type\":\"npm\"}` version `0.4.9`, so installation through Discover does not wait for anything else.\n","community-entry.json":"{\n  \"id\": \"dsh-douyin-all\",\n  \"name\": \"抖音自动陪伴\",\n  \"nameEn\": \"Douyin Auto Companion\",\n  \"author\": \"q616812935\",\n  \"description\": \"把抖音私信自动回复、作品评论自动回复、刷推荐流挑视频转发、人格与长期记忆、语音回复、观看日报合并成一个 DSH 插件，全部走同一个 Edge 浏览器会话。内置免打扰时段与发送频率限制，会真的“看”短视频并按自己的口味打分积累兴趣取向，也能在自己喜欢的别人作品下 @ 主人。含去重闸、禁词闸与站外引导拦截。\",\n  \"descriptionEn\": \"One DSH plugin that merges Douyin DM auto-reply, comment auto-reply on your own and others' works, recommendation-feed browsing with video sharing, persona plus long-term memory, voice replies and viewing reports, all driven through a single Edge browser session. Ships quiet hours and send-rate limits, actually \\\"watches\\\" each short video and accumulates its own taste profile, and can @-mention you under works it likes. Outbound guard covers duplicate, banned-word and off-site-link checks.\",\n  \"repo\": \"https://github.com/q616812935/dsh-douyin-all\",\n  \"npm\": \"dsh-douyin-all\",\n  \"category\": \"integration\",\n  \"subcategory\": \"bridge\"\n}"};
const L = (m) => { document.getElementById('o').textContent += m + '\n' };

  const put = await A(t, '/repos/' + acct + '/dsh-community-plugins/contents/community.json', { method: 'PUT', body: JSON.stringify({ message: 'feat(community-plugins): register dsh-douyin-all', content: b64e(JSON.stringify(arr, null, 2) + '\n'), sha: cur.sha, branch: 'main' }) })

  S('完成')
